<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="腎機能・化学療法・輸血・救急・緩和ケアなど18種類の臨床計算・スコアリングツール">
  <title>Clinical Calc Hub - 臨床計算・スコアリングツール</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#5e81b5',
              orange: '#e19c24',
              green: '#8fb131',
              red: '#ec6235',
              purple: '#8778b3',
              brown: '#c56e1a',
              cyan: '#5d9ec8',
              yellow: '#ffbf00'
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
    .scrollbar-thin::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-[#5e81b5] selection:text-white">

  <!-- Top Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-3">
      <!-- Logo & Title -->
      <div class="flex items-center space-x-2.5 shrink-0 cursor-pointer" onclick="selectCalculator('ccr')">
        <div class="w-9 h-9 rounded-xl bg-[#5e81b5] flex items-center justify-center text-white shadow-sm">
          <i data-lucide="stethoscope" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-sm sm:text-base leading-tight flex items-center gap-1.5">
            <span>臨床計算 Hub</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#5e81b5]/15 text-[#5e81b5] font-bold">18 Tools</span>
          </h1>
          <p class="text-[11px] text-slate-500 font-medium hidden sm:block">腎機能・化学療法・輸血・救急・緩和予後スコア</p>
        </div>
      </div>

      <!-- Quick Search Bar -->
      <div class="relative flex-1 max-w-md">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input type="text" id="toolSearchInput" placeholder="ツール名・キーワード検索 (例: カルボ, DIC, wells, 輸血...)"
               class="w-full pl-9 pr-8 py-1.5 sm:py-2 text-xs sm:text-sm bg-slate-100 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#5e81b5] focus:border-transparent transition"
               oninput="onSearchChange(this.value)">
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Mobile Menu Toggle Button -->
      <button onclick="toggleMobileDrawer()" class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Category Pills (Horizontal Scrollable) -->
    <div class="bg-slate-50 border-t border-slate-200/70 px-3 sm:px-6 py-1.5 overflow-x-auto scrollbar-thin">
      <div class="max-w-7xl mx-auto flex items-center space-x-1.5 text-xs font-medium shrink-0">
        <button onclick="filterCategory('all')" class="cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-[#5e81b5] text-white font-semibold shadow-2xs" data-cat="all">すべて</button>
        <button onclick="filterCategory('renal')" class="cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-white text-slate-600 hover:bg-slate-200" data-cat="renal">電解質・輸液・腎</button>
        <button onclick="filterCategory('onco')" class="cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-white text-slate-600 hover:bg-slate-200" data-cat="onco">腫瘍内科・化学療法</button>
        <button onclick="filterCategory('heme')" class="cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-white text-slate-600 hover:bg-slate-200" data-cat="heme">血液・輸血・移植</button>
        <button onclick="filterCategory('acute')" class="cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-white text-slate-600 hover:bg-slate-200" data-cat="acute">急性期・呼吸・肝</button>
        <button onclick="filterCategory('palliative')" class="cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-white text-slate-600 hover:bg-slate-200" data-cat="palliative">緩和ケア・予後・PS</button>
      </div>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="max-w-7xl mx-auto w-full flex-1 flex flex-col md:flex-row px-3 sm:px-6 py-4 gap-5">

    <!-- Sidebar / Tool List (Desktop) -->
    <aside id="sidebarNav" class="w-full md:w-80 shrink-0 hidden md:flex flex-col bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden h-[calc(100vh-140px)] sticky top-[120px]">
      <div class="p-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between text-xs font-bold text-slate-700">
        <span class="flex items-center gap-1.5"><i data-lucide="layout-grid" class="w-4 h-4 text-[#5e81b5]"></i> 計算ツール一覧</span>
        <span id="toolCountBadge" class="text-[11px] bg-slate-200 px-2 py-0.5 rounded-full text-slate-600 font-semibold">18件</span>
      </div>
      <div id="toolListContainer" class="flex-1 overflow-y-auto p-2 space-y-1 scrollbar-thin">
        <!-- Generated dynamically via JS -->
      </div>
    </aside>

    <!-- Mobile Drawer Modal for Tool Selection -->
    <div id="mobileDrawer" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs hidden md:hidden flex justify-end">
      <div class="w-4/5 max-w-sm bg-white h-full shadow-2xl flex flex-col">
        <div class="p-3.5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
          <div class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
            <i data-lucide="list" class="w-4 h-4 text-[#5e81b5]"></i> ツールを選択
          </div>
          <button onclick="toggleMobileDrawer()" class="p-1 rounded-lg text-slate-500 hover:bg-slate-200">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="mobileToolListContainer" class="flex-1 overflow-y-auto p-2 space-y-1">
          <!-- Generated dynamically via JS -->
        </div>
      </div>
    </div>

    <!-- Main Workspace Area -->
    <main class="flex-1 min-w-0 flex flex-col space-y-4">

      <!-- Calculator Main Card -->
      <div id="calculatorHost" class="bg-white rounded-2xl border border-slate-200/90 shadow-xs p-4 sm:p-6 transition-all">
        <!-- Rendered dynamically based on selected tool -->
      </div>

      <!-- Disclaimer Footer -->
      <div class="bg-white rounded-2xl border border-slate-200/80 p-4 text-xs text-slate-500 space-y-2">
        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-600">
          <span class="flex items-center gap-1.5 text-slate-700">
            <i data-lucide="shield-alert" class="w-4 h-4 text-[#e19c24]"></i> 臨床判断における免責事項
          </span>
          <span class="text-slate-400">GitHub Pages 完全対応 (クライアントサイド単一実行)</span>
        </div>
        <p class="leading-relaxed text-[11px] text-slate-500">
          本ツールは各種学会ガイドラインや文献公表式を元に計算・評価を行う参考ツールです。実際の臨床判断や治療方針決定は、患者の全身状態や合併症、各施設の基準および主治医等の専門的な医学的判断に基づいて行ってください。
        </p>
      </div>

    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toastNotification" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 transform transition duration-200 translate-y-16 opacity-0 pointer-events-none">
    <i data-lucide="check-circle" class="w-4 h-4 text-[#8fb131]"></i>
    <span id="toastMessage">コピーしました</span>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // =========================================================================
    // 1. Calculator Registry & Definitions (18 tools)
    // =========================================================================
    const CALCULATORS = [
      // Category: 電解質・輸液・腎 (renal)
      {
        id: 'ccr',
        title: 'CCr / eGFR 推算',
        shortDesc: 'Cockcroft-Gault式 & 日本腎臓学会eGFR',
        category: 'renal',
        categoryLabel: '電解質・腎',
        keywords: ['ccr', 'egfr', 'クレアチニンクリアランス', 'cg式', 'ckd', '腎機能', 'dubois', '体表面積'],
        render: renderCcr,
        onInput: calcCcr,
        sample: setSampleCcr
      },
      {
        id: 'fena',
        title: 'FENa / FEUrea 計算',
        shortDesc: 'ナトリウム・尿素窒素排泄分画 (AKI鑑別)',
        category: 'renal',
        categoryLabel: '電解質・腎',
        keywords: ['fena', 'feurea', 'feun', 'ナトリウム排泄分画', '尿細管', 'aki', '腎前性', '腎性', 'atn'],
        render: renderFena,
        onInput: calcFena,
        sample: setSampleFena
      },
      {
        id: 'adrogue',
        title: 'Adrogue-Madias 式',
        shortDesc: '低Na血症補正の輸液1Lあたり予想ΔNa',
        category: 'renal',
        categoryLabel: '電解質・腎',
        keywords: ['adrogue', 'madias', '低ナトリウム血症', '3%食塩水', '高張食塩水', '生理食塩水', 'ods', '補正速度', 'tbw'],
        render: renderAdrogue,
        onInput: calcAdrogue,
        sample: setSampleAdrogue
      },

      // Category: 腫瘍内科・化学療法 (onco)
      {
        id: 'calvert',
        title: 'カルボプラチン AUC (Calvert式)',
        shortDesc: '腎機能・目標AUCに応じた投与量算出',
        category: 'onco',
        categoryLabel: '腫瘍内科',
        keywords: ['calvert', 'カルボプラチン', 'carboplatin', 'cbdca', 'auc', 'gfr cap', '化学療法'],
        render: renderCalvert,
        onInput: calcCalvert,
        sample: setSampleCalvert
      },
      {
        id: 'carg',
        title: 'CARG スコア',
        shortDesc: '高齢がん患者の化学療法有害事象(Gr3-5)リスク予測',
        category: 'onco',
        categoryLabel: '腫瘍内科',
        keywords: ['carg', '高齢者', '化学療法毒性', 'hurria', '有害事象', '抗がん剤'],
        render: renderCarg,
        onInput: calcCarg,
        sample: setSampleCarg
      },
      {
        id: 'g8',
        title: 'G8 スコア',
        shortDesc: '高齢がん患者の簡易機能評価スクリーニング (17点満点)',
        category: 'onco',
        categoryLabel: '腫瘍内科',
        keywords: ['g8', '高齢者機能評価', 'cga', 'フレイル', 'スクリーニング', '栄養'],
        render: renderG8,
        onInput: calcG8,
        sample: setSampleG8
      },
      {
        id: 'fn',
        title: 'MASCC / CISNE スコア',
        shortDesc: '発熱性好中球減少症 (FN) のリスク・外来治療判定',
        category: 'onco',
        categoryLabel: '腫瘍内科',
        keywords: ['mascc', 'cisne', 'fn', '発熱性好中球減少症', 'febrile neutropenia', '外来治療'],
        render: renderFn,
        onInput: calcFn,
        sample: setSampleFn
      },
      {
        id: 'khorana',
        title: 'Khorana スコア',
        shortDesc: '外来がん化学療法患者の静脈血栓塞栓症 (VTE) リスク',
        category: 'onco',
        categoryLabel: '腫瘍内科',
        keywords: ['khorana', 'vte', '深部静脈血栓', '肺塞栓', '抗凝固', '悪性腫瘍'],
        render: renderKhorana,
        onInput: calcKhorana,
        sample: setSampleKhorana
      },

      // Category: 血液・輸血・移植 (heme)
      {
        id: 'transfusion',
        title: '輸血効果予測 (RBC / PLT) & CCI',
        shortDesc: '赤血球・血小板輸血の増加予測・不応状態判定',
        category: 'heme',
        categoryLabel: '血液・輸血',
        keywords: ['輸血', 'rbc', 'plt', '濃厚血小板', '赤血球', 'hb上昇', 'cci', '血小板輸血不応状態', 'ptr'],
        render: renderTransfusion,
        onInput: calcTransfusion,
        sample: setSampleTransfusion
      },
      {
        id: 'hokus10',
        title: 'HokUS-10 (VOD/SOS)',
        shortDesc: '造血幹細胞移植後 SOS/VOD の腹部超音波スコア',
        category: 'heme',
        categoryLabel: '血液・輸血',
        keywords: ['hokus', 'hokus-10', 'vod', 'sos', '類洞閉塞症候群', '造血幹細胞移植', 'エコー', '北大'],
        render: renderHokus,
        onInput: calcHokus,
        sample: setSampleHokus
      },
      {
        id: 'hlh',
        title: '血球貪食症候群 (HLH) 診断基準',
        shortDesc: 'HLH-2004基準 & 成人HScore確率評価',
        category: 'heme',
        categoryLabel: '血液・輸血',
        keywords: ['hlh', '血球貪食症候群', 'hlh-2004', 'hscore', 'フェリチン', 'sil-2r', '貪食像'],
        render: renderHlh,
        onInput: calcHlh,
        sample: setSampleHlh
      },

      // Category: 急性期・呼吸・肝 (acute)
      {
        id: 'childpugh',
        title: 'Child-Pugh スコア',
        shortDesc: '肝硬変の重症度分類 (Class A/B/C)',
        category: 'acute',
        categoryLabel: '急性期・肝',
        keywords: ['child', 'pugh', 'child-pugh', '肝硬変', 'ビリルビン', 'アルブミン', '腹水', '脳症', 'pt-inr'],
        render: renderChildPugh,
        onInput: calcChildPugh,
        sample: setSampleChildPugh
      },
      {
        id: 'dic',
        title: '急性期 DIC 診断基準 (JAAM)',
        shortDesc: '救急医学会 JAAM 急性期DICスコア (4点以上でDIC)',
        category: 'acute',
        categoryLabel: '急性期',
        keywords: ['dic', 'jaam', '急性期dic', 'sirs', 'fdp', 'd-dimer', '血小板', 'pt比'],
        render: renderDic,
        onInput: calcDic,
        sample: setSampleDic
      },
      {
        id: 'pe',
        title: 'Modified Wells / 改定Geneva (PE)',
        shortDesc: '急性肺血栓塞栓症 (PE) の臨床的予測スコア',
        category: 'acute',
        categoryLabel: '急性期・呼吸',
        keywords: ['wells', 'geneva', 'pe', '肺塞栓', '肺血栓塞栓症', 'dvt', 'd-dimer'],
        render: renderPe,
        onInput: calcPe,
        sample: setSamplePe
      },
      {
        id: 'light',
        title: '胸水 Light の基準',
        shortDesc: '胸水の性状鑑別 (滲出性 Exudate vs 漏出性 Transudate)',
        category: 'acute',
        categoryLabel: '呼吸器',
        keywords: ['light', '胸水', '滲出性', '漏出性', 'exudate', 'transudate', 'ldh', 'タンパク比', 'alb勾配'],
        render: renderLight,
        onInput: calcLight,
        sample: setSampleLight
      },

      // Category: 緩和ケア・予後・PS (palliative)
      {
        id: 'katagiri',
        title: '新片桐スコア (骨転移予後)',
        shortDesc: '骨転移を有するがん患者の生命予後予測 (1年生存率)',
        category: 'palliative',
        categoryLabel: '緩和・予後',
        keywords: ['片桐', '新片桐スコア', 'katagiri', '骨転移', '予後予測', '生存率', '整形外科'],
        render: renderKatagiri,
        onInput: calcKatagiri,
        sample: setSampleKatagiri
      },
      {
        id: 'pap_ppi',
        title: 'PaP スコア / PPI / PPS',
        shortDesc: '終末期がん患者の生命予後予測 (週・日数)',
        category: 'palliative',
        categoryLabel: '緩和・予後',
        keywords: ['pap', 'ppi', 'pps', '緩和ケア', '生命予後', 'palliative', '予後予測'],
        render: renderPapPpi,
        onInput: calcPapPpi,
        sample: setSamplePapPpi
      },
      {
        id: 'ecog_kps',
        title: 'ECOG-PS & KPS 対比',
        shortDesc: 'パフォーマンスステータス評価・ワンクリックカルテ記載',
        category: 'palliative',
        categoryLabel: '全身状態',
        keywords: ['ps', 'ecog', 'karnofsky', 'kps', 'パフォーマンスステータス', '全身状態', 'adl'],
        render: renderEcogKps,
        onInput: calcEcogKps,
        sample: setSampleEcogKps
      }
    ];

    // =========================================================================
    // 2. Navigation, Search & State Management
    // =========================================================================
    let currentCalcId = 'ccr';
    let currentCategory = 'all';
    let searchQuery = '';
    let currentCopyText = '';

    window.addEventListener('DOMContentLoaded', () => {
      renderSidebarList();
      selectCalculator('ccr');
      lucide.createIcons();
    });

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = "cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-[#5e81b5] text-white font-semibold shadow-2xs";
        } else {
          btn.className = "cat-pill px-3 py-1 rounded-lg transition shrink-0 bg-white text-slate-600 hover:bg-slate-200";
        }
      });
      renderSidebarList();
    }

    function onSearchChange(val) {
      searchQuery = val.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderSidebarList();
    }

    function clearSearch() {
      const input = document.getElementById('toolSearchInput');
      input.value = '';
      onSearchChange('');
      input.focus();
    }

    function toggleMobileDrawer() {
      const drawer = document.getElementById('mobileDrawer');
      drawer.classList.toggle('hidden');
      lucide.createIcons();
    }

    function selectCalculator(id) {
      currentCalcId = id;
      const calc = CALCULATORS.find(c => c.id === id);
      if (!calc) return;

      // Update Active class in lists
      document.querySelectorAll('.tool-nav-item').forEach(el => {
        if (el.getAttribute('data-id') === id) {
          el.className = "tool-nav-item w-full text-left p-2.5 rounded-xl transition flex items-center justify-between gap-2 bg-[#5e81b5]/10 border border-[#5e81b5]/40 text-[#5e81b5] shadow-2xs font-semibold";
        } else {
          el.className = "tool-nav-item w-full text-left p-2.5 rounded-xl transition flex items-center justify-between gap-2 hover:bg-slate-100 text-slate-700 font-normal";
        }
      });

      // Render Calculator UI
      const host = document.getElementById('calculatorHost');
      host.innerHTML = calc.render();
      lucide.createIcons();

      // Trigger calculation
      calc.onInput();

      // Close mobile drawer if open
      document.getElementById('mobileDrawer').classList.add('hidden');
    }

    function renderSidebarList() {
      const filtered = CALCULATORS.filter(c => {
        const matchesCategory = currentCategory === 'all' || c.category === currentCategory;
        const matchesSearch = !searchQuery ||
          c.title.toLowerCase().includes(searchQuery) ||
          c.shortDesc.toLowerCase().includes(searchQuery) ||
          c.keywords.some(k => k.toLowerCase().includes(searchQuery));
        return matchesCategory && matchesSearch;
      });

      document.getElementById('toolCountBadge').textContent = `${filtered.length}件`;

      const createItemHtml = (c) => `
        <button onclick="selectCalculator('${c.id}')" data-id="${c.id}" class="tool-nav-item w-full text-left p-2.5 rounded-xl transition flex items-center justify-between gap-2 ${c.id === currentCalcId ? 'bg-[#5e81b5]/10 border border-[#5e81b5]/40 text-[#5e81b5] shadow-2xs font-semibold' : 'hover:bg-slate-100 text-slate-700'}">
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold truncate">${c.title}</div>
            <div class="text-[11px] text-slate-400 truncate">${c.shortDesc}</div>
          </div>
          <span class="text-[9px] px-1.5 py-0.5 rounded-md font-semibold bg-slate-200/80 text-slate-600 shrink-0">${c.categoryLabel}</span>
        </button>
      `;

      const listDesktop = document.getElementById('toolListContainer');
      const listMobile = document.getElementById('mobileToolListContainer');

      if (filtered.length === 0) {
        const emptyHtml = `<div class="p-6 text-center text-xs text-slate-400">該当するツールが見つかりません</div>`;
        listDesktop.innerHTML = emptyHtml;
        listMobile.innerHTML = emptyHtml;
      } else {
        const fullHtml = filtered.map(createItemHtml).join('');
        listDesktop.innerHTML = fullHtml;
        listMobile.innerHTML = fullHtml;
      }
      lucide.createIcons();
    }

    // Copy helper
    async function copyToClipboard(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showToast("カルテ用テキストをコピーしました");
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast("カルテ用テキストをコピーしました");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMessage').textContent = msg;
      toast.classList.remove('translate-y-16', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 1800);
    }

    function setSampleCcr() {
      document.querySelector('input[name="ccrGender"][value="male"]').checked = true;
      document.getElementById('ccrAge').value = '65';
      document.getElementById('ccrWeight').value = '60.0';
      document.getElementById('ccrCre').value = '1.10';
      document.getElementById('ccrHeight').value = '165.0';
      calcCcr();
    }

    function calcCcr() {
      const genderElem = document.querySelector('input[name="ccrGender"]:checked');
      if (!genderElem) return;
      const gender = genderElem.value;
      const age = parseFloat(document.getElementById('ccrAge')?.value);
      const weight = parseFloat(document.getElementById('ccrWeight')?.value);
      const cre = parseFloat(document.getElementById('ccrCre')?.value);
      const height = parseFloat(document.getElementById('ccrHeight')?.value);

      const resCcr = document.getElementById('resCcr');
      const resEgfr = document.getElementById('resEgfr');
      const resCkd = document.getElementById('resCkdStage');
      const bsaRow = document.getElementById('bsaAdjustedRow');

      if (!age || !weight || !cre || age <= 0 || weight <= 0 || cre <= 0) {
        if (resCcr) resCcr.textContent = '--';
        if (resEgfr) resEgfr.textContent = '--';
        if (resCkd) resCkd.textContent = '--';
        if (bsaRow) bsaRow.classList.add('hidden');
        currentCopyText = '';
        return;
      }

      let ccr = ((140 - age) * weight) / (72 * cre);
      if (gender === 'female') ccr *= 0.85;
      const ccrFmt = ccr.toFixed(1);
      resCcr.textContent = ccrFmt;

      let egfr = 194 * Math.pow(cre, -1.094) * Math.pow(age, -0.287);
      if (gender === 'female') egfr *= 0.739;
      const egfrFmt = egfr.toFixed(1);
      resEgfr.textContent = egfrFmt;

      let ckd = "";
      if (egfr >= 90) ckd = "G1 (正常または高値)";
      else if (egfr >= 60) ckd = "G2 (正常〜軽度低下)";
      else if (egfr >= 45) ckd = "G3a (軽度〜中等度低下)";
      else if (egfr >= 30) ckd = "G3b (中等度〜高度低下)";
      else if (egfr >= 15) ckd = "G4 (高度低下)";
      else ckd = "G5 (末期腎不全)";
      resCkd.textContent = ckd;

      let bsaFmt = "", ccrBsaFmt = "";
      if (height && height > 0) {
        const bsa = 0.007184 * Math.pow(height, 0.725) * Math.pow(weight, 0.425);
        const ccrBsa = (ccr * 1.73) / bsa;
        bsaFmt = bsa.toFixed(2);
        ccrBsaFmt = ccrBsa.toFixed(1);
        document.getElementById('resBsa').textContent = bsaFmt;
        document.getElementById('resCcrBsa').textContent = ccrBsaFmt;
        bsaRow.classList.remove('hidden');
      } else {
        bsaRow.classList.add('hidden');
      }

      const genderStr = gender === 'male' ? '男性' : '女性';
      currentCopyText = `【腎機能推算 (CCr / eGFR)】\n` +
        `・患者: ${genderStr}, ${age}歳, ${weight}kg${height ? `, ${height}cm` : ''}\n` +
        `・血清Cr: ${cre} mg/dL\n` +
        `・推算CCr (C-G式): ${ccrFmt} mL/min\n` +
        (height ? `・推算CCr (1.73m²補正): ${ccrBsaFmt} mL/min/1.73m² (BSA: ${bsaFmt} m²)\n` : '') +
        `・推算eGFR (日本腎臓学会式): ${egfrFmt} mL/min/1.73m² [${ckd}]`;
    }

    function copyCcrResult() { copyToClipboard(currentCopyText); }

    function setSampleFena() {
      document.getElementById('fenaSNa').value = '140';
      document.getElementById('fenaUNa').value = '14';

      document.getElementById('feunSBun').value = '45';
      document.getElementById('feunUUn').value = '400';
      calcFena();
    }

    function calcFena() {
      const sNa = parseFloat(document.getElementById('fenaSNa')?.value);
      const uNa = parseFloat(document.getElementById('fenaUNa')?.value);
      const sCr = parseFloat(document.getElementById('fenaSCr')?.value);
      const uCr = parseFloat(document.getElementById('fenaUCr')?.value);
      const sBun = parseFloat(document.getElementById('feunSBun')?.value);
      const uUn = parseFloat(document.getElementById('feunUUn')?.value);

      const resFena = document.getElementById('resFena');
      const fenaBadge = document.getElementById('fenaBadge');
      const fenaNote = document.getElementById('fenaNote');

      const resFeun = document.getElementById('resFeun');
      const feunBadge = document.getElementById('feunBadge');
      const feunBox = document.getElementById('feunResultBox');

      if (!sNa || !uNa || !sCr || !uCr || sNa <= 0 || uCr <= 0 || sCr <= 0) {
        if (resFena) resFena.textContent = '--';
        if (fenaBadge) fenaBadge.classList.add('hidden');
        if (fenaNote) fenaNote.textContent = '数値を入力してください';
        currentCopyText = '';
        return;
      }

      const fena = ((uNa * sCr) / (sNa * uCr)) * 100;
      const fenaFmt = fena.toFixed(2);
      resFena.textContent = fenaFmt;
      fenaBadge.classList.remove('hidden');

      let fenaEval = "";
      if (fena < 1.0) {
        fenaBadge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#8fb131]/20 text-[#8fb131]";
        fenaBadge.textContent = "腎前性疑い (<1%)";
        fenaNote.textContent = "【腎前性 AKI 示唆】脱水・心不全等。尿細管のNa再吸収能は維持されています。";
        fenaEval = "腎前性疑い (<1%)";
      } else if (fena <= 2.0) {
        fenaBadge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#e19c24]/20 text-[#e19c24]";
        fenaBadge.textContent = "境界域 (1〜2%)";
        fenaNote.textContent = "【境界域】臨床所見・病歴・尿沈渣等と併せて総合判定してください。";
        fenaEval = "境界域 (1〜2%)";
      } else {
        fenaBadge.className = "px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#ec6235]/20 text-[#ec6235]";
        fenaBadge.textContent = "腎性/ATN疑い (>2%)";
        fenaNote.textContent = "【腎性 AKI 示唆】急性尿細管壊死(ATN)等によるNa再吸収不全が疑われます。";
        fenaEval = "腎性/ATN疑い (>2%)";
      }

      let feunFmt = "", feunEval = "";
      if (sBun && uUn && sBun > 0 && uUn > 0) {
        const feun = ((uUn * sCr) / (sBun * uCr)) * 100;
        feunFmt = feun.toFixed(1);
        resFeun.textContent = feunFmt;
        feunBox.classList.remove('opacity-60');
        feunBadge.classList.remove('hidden');
        if (feun < 35) {

    function setSampleAdrogue() {
      document.getElementById('adrogueWeight').value = '50.0';

    function calcAdrogue() {
      const coef = parseFloat(document.getElementById('adroguePatientType')?.value || 0.6);
      const weight = parseFloat(document.getElementById('adrogueWeight')?.value);
      const sNa = parseFloat(document.getElementById('adrogueSNa')?.value);
      const fluidVal = document.getElementById('adrogueFluid')?.value || "154,0";
      const [infNa, infK] = fluidVal.split(',').map(Number);

      const resDelta = document.getElementById('resDeltaNa');
      const resTbw = document.getElementById('resTbw');
      const resReqVol = document.getElementById('resReqVol');
      const resDripRate = document.getElementById('resDripRate');

      if (!weight || !sNa || weight <= 0 || sNa <= 0) {
        if (resDelta) resDelta.textContent = '--';
        if (resTbw) resTbw.textContent = '--';
        if (resReqVol) resReqVol.textContent = '--';
        if (resDripRate) resDripRate.textContent = '--';
        currentCopyText = '';
        return;
      }

      const tbw = weight * coef;
      const deltaNa = (infNa + infK - sNa) / (tbw + 1);
      const deltaNaSign = deltaNa >= 0 ? `+${deltaNa.toFixed(2)}` : deltaNa.toFixed(2);
      resDelta.textContent = deltaNaSign;
      resTbw.textContent = tbw.toFixed(1);

      if (deltaNa > 0) {
        const targetDelta = 5.0; // 5 mEq/L target
        const reqVol = (targetDelta / deltaNa) * 1000;
        const dripRate = reqVol / 24;
        resReqVol.textContent = Math.round(reqVol).toLocaleString();
        resDripRate.textContent = dripRate.toFixed(1);

        currentCopyText = `【Adrogue-Madias式 低Na血症補正計算】\n` +
          `・患者情報: 体重 ${weight}kg, 現在の血清Na ${sNa} mEq/L (TBW: ${tbw.toFixed(1)}L)\n` +
          `・選択輸液: 輸液中Na ${infNa} mEq/L, K ${infK} mEq/L\n` +
          `・輸液1Lあたりの予想ΔNa: ${deltaNaSign} mEq/L\n` +
          `・ΔNa 5mEq/L上昇に必要な液量: 約 ${Math.round(reqVol)} mL (推奨速度: 約 ${dripRate.toFixed(1)} mL/hr)\n` +
          `※ 24時間の上昇幅は最大 8〜10 mEq/L (ハイリスクは6〜8) を厳守してください。`;
      } else {
        resReqVol.textContent = 'Na低下';
        resDripRate.textContent = '--';
        currentCopyText = `【Adrogue-Madias式 低Na血症補正計算】\n` +
          `・患者情報: 体重 ${weight}kg, 現在の血清Na ${sNa} mEq/L\n` +
          `・輸液1Lあたりの予想ΔNa: ${deltaNaSign} mEq/L (血清Na低下方向)`;
      }
    }

    function setSampleCalvert() {
      document.getElementById('calvertAuc').value = '5';
      document.getElementById('calvertGender').value = 'female';
      document.getElementById('calvertAge').value = '62';
      document.getElementById('calvertWeight').value = '52.0';
      document.getElementById('calvertCr').value = '0.80';
      calcCalvert();
    }

    function calcCalvert() {
      const auc = parseFloat(document.getElementById('calvertAuc')?.value);
      const gender = document.getElementById('calvertGender')?.value;
      const age = parseFloat(document.getElementById('calvertAge')?.value);
      const weight = parseFloat(document.getElementById('calvertWeight')?.value);
      const cr = parseFloat(document.getElementById('calvertCr')?.value);
      const isCap = document.getElementById('calvertCap')?.checked;

      const resDose = document.getElementById('resCalvertDose');
      const resGfr = document.getElementById('resCalvertGfr');
      const resCapped = document.getElementById('resCalvertCapped');

      if (!auc || !age || !weight || !cr || auc <= 0 || age <= 0 || weight <= 0 || cr <= 0) {
        if (resDose) resDose.textContent = '--';
        if (resGfr) resGfr.textContent = '--';
        if (resCapped) resCapped.classList.add('hidden');
        currentCopyText = '';
        return;
      }

      let ccr = ((140 - age) * weight) / (72 * cr);
      if (gender === 'female') ccr *= 0.85;

      let effectiveGfr = ccr;
      let wasCapped = false;
      if (isCap && effectiveGfr > 125) {
        effectiveGfr = 125;
        wasCapped = true;
      }

      const dose = Math.round(auc * (effectiveGfr + 25));
      resDose.textContent = dose.toLocaleString();
      resGfr.textContent = ccr.toFixed(1);

      if (wasCapped) {
        resCapped.classList.remove('hidden');
      } else {
        resCapped.classList.add('hidden');
      }

      currentCopyText = `【カルボプラチン投与量 (Calvert式)】\n` +
        `・目標AUC: ${auc}\n` +
        `・患者: ${gender === 'male' ? '男性' : '女性'}, ${age}歳, ${weight}kg, 血清Cr ${cr} mg/dL\n` +
        `・推算CCr: ${ccr.toFixed(1)} mL/min ${wasCapped ? '(※GFR上限125mL/minキャップ適用)' : ''}\n` +
        `・カルボプラチン計算投与量: ${dose} mg`;
    }

    function copyCalvertResult() { copyToClipboard(currentCopyText); }

    function calcFn() {
      // MASCC
      const mIds = ['masccBurden', 'masccHypotension', 'masccCopd', 'masccCancer', 'masccDehyd', 'masccSetting', 'masccAge'];
      let mascc = 0;
      mIds.forEach(id => { mascc += parseInt(document.getElementById(id)?.value || 0, 10); });
      const resM = document.getElementById('resMasccScore');
      const badgeM = document.getElementById('masccBadge');
      const descM = document.getElementById('masccDesc');
      if (resM) {
        resM.textContent = mascc;
        if (mascc >= 21) {
          badgeM.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]";
          badgeM.textContent = "低リスク (≥21点)";

          descM.textContent = "入院のうえ、広域抗菌薬の点滴投与が推奨されます";
        }
      }

      // CISNE
      const cIds = ['cisnePs', 'cisneCopd', 'cisneCvd', 'cisneMuc', 'cisneGlu', 'cisneAnc'];
      let cisne = 0;
      cIds.forEach(id => { cisne += parseInt(document.getElementById(id)?.value || 0, 10); });
      const resC = document.getElementById('resCisneScore');
      const badgeC = document.getElementById('cisneBadge');
      const descC = document.getElementById('cisneDesc');
      if (resC) {
        resC.textContent = cisne;
        if (cisne === 0) {
          badgeC.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]";
          badgeC.textContent = "Class I: 低リスク (0点)";
          descC.textContent = "重篤合併症リスク: 約 1.1%";
        } else if (cisne <= 2) {
          badgeC.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#e19c24]/20 text-[#e19c24]";
          badgeC.textContent = "Class II: 中リスク (1〜2点)";
          descC.textContent = "重篤合併症リスク: 約 6.2%";
        } else {
          badgeC.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#ec6235]/20 text-[#ec6235]";
          badgeC.textContent = "Class III: 高リスク (≥3点)";
          descC.textContent = "重篤合併症リスク: 約 36%";
        }
      }

      if (activeFnSubTab === 'mascc') {
        currentCopyText = `【発熱性好中球減少症 (FN) MASCCスコア】\n` +
          `・MASCCスコア: ${mascc} / 26 点 [${mascc >= 21 ? '低リスク (外来治療考慮可能)' : '高リスク (入院・点滴抗菌薬必須)'}]\n` +
          `※ 重篤合併症率: 低リスク群で <5%、死亡率 <1〜2%`;
      } else {
        currentCopyText = `【安定固形癌FN CISNEスコア】\n` +
          `・CISNEスコア: ${cisne} 点 [${cisne === 0 ? 'Class I (低リスク: 1.1%)' : cisne <= 2 ? 'Class II (中リスク: 6.2%)' : 'Class III (高リスク: 36%)'}]`;
      }
    }

    function setSampleTransfusion() {
      document.getElementById('rbcWeight').value = '50.0';
      document.getElementById('rbcPreHb').value = '6.8';
      document.getElementById('pltWeight').value = '50.0';
      document.getElementById('pltPreCount').value = '1.0';
      calcTransfusion();
    }

    function calcTransfusion() {
      const rbcWeight = parseFloat(document.getElementById('rbcWeight')?.value);
      const rbcUnits = parseFloat(document.getElementById('rbcUnits')?.value || 2);
      const rbcPreHb = parseFloat(document.getElementById('rbcPreHb')?.value);

      const pltWeight = parseFloat(document.getElementById('pltWeight')?.value);
      const pltUnits = parseFloat(document.getElementById('pltUnits')?.value || 10);
      const pltPreCount = parseFloat(document.getElementById('pltPreCount')?.value);

      const resDeltaHb = document.getElementById('resDeltaHb');
      const resPostHb = document.getElementById('resPostHb');
      const resDeltaPlt = document.getElementById('resDeltaPlt');
      const resPostPlt = document.getElementById('resPostPlt');

      let deltaHbFmt = "--", postHbFmt = "--";
      if (rbcWeight && rbcWeight > 0) {
        const deltaHb = (rbcUnits * 40) / rbcWeight;
        deltaHbFmt = deltaHb.toFixed(1);
        resDeltaHb.textContent = deltaHbFmt;
        if (rbcPreHb) {
          postHbFmt = (rbcPreHb + deltaHb).toFixed(1);
          resPostHb.textContent = postHbFmt;
        } else {
          resPostHb.textContent = '--';
        }
      } else {
        resDeltaHb.textContent = '--';
        resPostHb.textContent = '--';
      }

      let deltaPltFmt = "--", postPltFmt = "--";
      if (pltWeight && pltWeight > 0) {
        const deltaPltPerUl = (pltUnits * 2e10 * (2/3)) / (pltWeight * 70 * 1000);
        const deltaPltMan = deltaPltPerUl / 10000;
        deltaPltFmt = deltaPltMan.toFixed(1);
        resDeltaPlt.textContent = deltaPltFmt;
        if (pltPreCount) {
          postPltFmt = (pltPreCount + deltaPltMan).toFixed(1);
          resPostPlt.textContent = postPltFmt;
        } else {
          resPostPlt.textContent = '--';
        }
      } else {
        resDeltaPlt.textContent = '--';
        resPostPlt.textContent = '--';
      }

      // CCI
      const cciPre = parseFloat(document.getElementById('cciPre')?.value);
      const cciPost = parseFloat(document.getElementById('cciPost')?.value);
      const cciBsa = parseFloat(document.getElementById('cciBsa')?.value);
      const cciUnits = parseFloat(document.getElementById('cciUnits')?.value || 10);
      const resCci = document.getElementById('resCciVal');
      if (cciPre >= 0 && cciPost > cciPre && cciBsa > 0) {
        const totalPlt1011 = cciUnits * 0.2;
        const cci = ((cciPost - cciPre) * cciBsa) / totalPlt1011;
        resCci.textContent = Math.round(cci).toLocaleString();
      } else if (resCci) {
        resCci.textContent = '--';
      }

      currentCopyText = `【輸血効果予測】\n` +
        (rbcWeight ? `・RBC輸血 (${rbcUnits}単位, 体重${rbcWeight}kg): 予想ΔHb +${deltaHbFmt} g/dL${postHbFmt !== '--' ? ` (予測後: ${postHbFmt} g/dL)` : ''}\n` : '') +

    }

    function calcDic() {

      resScore.textContent = score;

      let isDic = score >= 4;

        badge.textContent = `急性期 DIC 診断 (≥4点)`;

    let activePeSubTab = 'wells';
    function switchPeSubTab(tab) {
      activePeSubTab = tab;
      const tabW = document.getElementById('peSubTabWells');
      const tabG = document.getElementById('peSubTabGeneva');
      const contW = document.getElementById('peWellsContent');
      const contG = document.getElementById('peGenevaContent');

      if (tab === 'wells') {
        tabW.className = "flex-1 py-1.5 rounded-lg bg-white text-[#5e81b5] shadow-2xs";
        tabG.className = "flex-1 py-1.5 rounded-lg text-slate-600 hover:text-slate-900";
        contW.classList.remove('hidden');
        contG.classList.add('hidden');
      } else {
        tabG.className = "flex-1 py-1.5 rounded-lg bg-white text-[#5e81b5] shadow-2xs";
        tabW.className = "flex-1 py-1.5 rounded-lg text-slate-600 hover:text-slate-900";
        contG.classList.remove('hidden');
        contW.classList.add('hidden');
      }
      calcPe();
    }

    function setSamplePe() {
      if (activePeSubTab === 'wells') {
        document.getElementById('wellsDvt').value = '3';
        document.getElementById('wellsAlt').value = '3';
        document.getElementById('wellsHr').value = '1.5';
      } else {
        document.getElementById('genAge').value = '1';
        document.getElementById('genPain').value = '3';
        document.getElementById('genHr').value = '5';
      }
      calcPe();
    }

    function calcPe() {
      // Wells
      const wDvt = parseFloat(document.getElementById('wellsDvt')?.value || 0);
      const wAlt = parseFloat(document.getElementById('wellsAlt')?.value || 0);
      const wHr = parseFloat(document.getElementById('wellsHr')?.value || 0);
      const wImmob = parseFloat(document.getElementById('wellsImmob')?.value || 0);
      const wPrev = parseFloat(document.getElementById('wellsPrev')?.value || 0);
      const wHemo = parseFloat(document.getElementById('wellsHemo')?.value || 0);
      const wMalign = parseFloat(document.getElementById('wellsMalign')?.value || 0);

      const wellsScore = wDvt + wAlt + wHr + wImmob + wPrev + wHemo + wMalign;
      const resW = document.getElementById('resWellsScore');
      const badgeW = document.getElementById('wellsBadge');
      const descW = document.getElementById('wellsDesc');
      if (resW) {
        resW.textContent = wellsScore;
        if (wellsScore <= 4) {
          badgeW.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]";
          badgeW.textContent = "PE unlikely (≤4点)";
          descW.textContent = "D-dimer 陰性でPEを除外可能";
        } else {
          badgeW.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#ec6235]/20 text-[#ec6235]";
          badgeW.textContent = "PE likely (>4点)";
          descW.textContent = "造影CT (CTPA) または抗凝固の検討を推奨";
        }
      }

      // Geneva
      const gIds = ['genAge', 'genPrev', 'genSurg', 'genMalign', 'genPain', 'genHemo', 'genHr', 'genEdema'];
      let genevaScore = 0;
      gIds.forEach(id => { genevaScore += parseInt(document.getElementById(id)?.value || 0, 10); });
      const resG = document.getElementById('resGenevaScore');
      const badgeG = document.getElementById('genevaBadge');
      const descG = document.getElementById('genevaDesc');
      if (resG) {
        resG.textContent = genevaScore;
        if (genevaScore <= 3) {
          badgeG.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]";
          badgeG.textContent = "低リスク (0〜3点)";
          descG.textContent = "PE確率 約 8%";
        } else if (genevaScore <= 10) {
          badgeG.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#e19c24]/20 text-[#e19c24]";
          badgeG.textContent = "中リスク (4〜10点)";
          descG.textContent = "PE確率 約 28%";
        } else {
          badgeG.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#ec6235]/20 text-[#ec6235]";
          badgeG.textContent = "高リスク (≥11点)";
          descG.textContent = "PE確率 約 74% (造影CT推奨)";
        }
      }

      if (activePeSubTab === 'wells') {
        currentCopyText = `【Modified Wells 肺塞栓症(PE)スコア】\n` +
          `・スコア: ${wellsScore} 点 [${wellsScore <= 4 ? 'PE unlikely (≤4点: D-dimer除外可能)' : 'PE likely (>4点: 造影CT推奨)'}]`;
      } else {
        currentCopyText = `【改定 Geneva 肺塞栓症(PE)スコア】\n` +
          `・スコア: ${genevaScore} 点 [${genevaScore <= 3 ? '低リスク (0-3点)' : genevaScore <= 10 ? '中リスク (4-10点)' : '高リスク (≥11点)'}]`;
      }
    }

    function copyPeResult() { copyToClipboard(currentCopyText); }

    function setSampleLight() {
      document.getElementById('lightPtp').value = '3.8';
      document.getElementById('lightStp').value = '6.4';
      document.getElementById('lightPldh').value = '310';
      document.getElementById('lightSldh').value = '190';
      document.getElementById('lightUlnLdh').value = '220';
      calcLight();
    }

    function calcLight() {
      const pTp = parseFloat(document.getElementById('lightPtp')?.value);
      const sTp = parseFloat(document.getElementById('lightStp')?.value);
      const pLdh = parseFloat(document.getElementById('lightPldh')?.value);
      const sLdh = parseFloat(document.getElementById('lightSldh')?.value);
      const ulnLdh = parseFloat(document.getElementById('lightUlnLdh')?.value || 220);
      const albGrad = parseFloat(document.getElementById('lightAlbGrad')?.value);

      const badge = document.getElementById('lightBadge');
      const resTp = document.getElementById('resLightTpRatio');
      const resLdh = document.getElementById('resLightLdhRatio');
      const resCut = document.getElementById('resLightLdhCutoff');
      const albNote = document.getElementById('lightAlbNote');

      if (!pTp || !sTp || !pLdh || !sLdh) {
        if (badge) {
          badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-700";
          badge.textContent = "値を入力してください";
        }
        if (resTp) resTp.textContent = '--';
        if (resLdh) resLdh.textContent = '--';
        if (resCut) resCut.textContent = '--';
        if (albNote) albNote.classList.add('hidden');
        currentCopyText = '';
        return;
      }

      const tpRatio = pTp / sTp;
      const ldhRatio = pLdh / sLdh;
      const ldh23 = (ulnLdh * 2) / 3;

      const c1 = tpRatio > 0.5;
      const c2 = ldhRatio > 0.6;
      const c3 = pLdh > ldh23;

      resTp.innerHTML = `${tpRatio.toFixed(2)} ${c1 ? '<span class="text-[#ec6235] font-bold">[陽性]</span>' : '<span class="text-slate-400">[陰性]</span>'}`;
      resLdh.innerHTML = `${ldhRatio.toFixed(2)} ${c2 ? '<span class="text-[#ec6235] font-bold">[陽性]</span>' : '<span class="text-slate-400">[陰性]</span>'}`;
      resCut.innerHTML = `${pLdh} (基準: &gt;${Math.round(ldh23)}) ${c3 ? '<span class="text-[#ec6235] font-bold">[陽性]</span>' : '<span class="text-slate-400">[陰性]</span>'}`;

      const isExudate = c1 || c2 || c3;

      let finalEval = "";
      if (isExudate) {
        if (albGrad && albGrad > 1.2) {
          badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#5e81b5]/20 text-[#5e81b5]";
          badge.textContent = "漏出性胸水 (Alb勾配補正)";
          finalEval = "漏出性胸水 (Transudate) ※Alb勾配 > 1.2g/dL による補正判定";
          albNote.textContent = `※ Light基準では滲出性ですが、血清-胸水Alb勾配 (${albGrad} > 1.2 g/dL) より利尿薬下の漏出性胸水が示唆されます。`;
          albNote.classList.remove('hidden');
        } else {
          badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#ec6235]/20 text-[#ec6235]";
          badge.textContent = "滲出性胸水 (Exudate)";
          finalEval = "滲出性胸水 (Exudate)";
          albNote.classList.add('hidden');
        }
      } else {
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]";
        badge.textContent = "漏出性胸水 (Transudate)";
        finalEval = "漏出性胸水 (Transudate)";
        albNote.classList.add('hidden');
      }

      currentCopyText = `【胸水 Light の基準判定】\n` +
        `・検査値: 胸水TP ${pTp} / 血清TP ${sTp} (比: ${tpRatio.toFixed(2)}), 胸水LDH ${pLdh} / 血清LDH ${sLdh} (比: ${ldhRatio.toFixed(2)})\n` +
        `・判定結果: 【${finalEval}】\n` +
        `・Light基準項目: TP比>0.5(${c1 ? '陽性' : '陰性'}), LDH比>0.6(${c2 ? '陽性' : '陰性'}), 胸水LDH>正常上限2/3(${c3 ? '陽性' : '陰性'})`;
    }

    function copyLightResult() { copyToClipboard(currentCopyText); }

    function calcKatagiri() {
      const ids = ['kataPrimary', 'kataVisceral', 'kataLab', 'kataPs', 'kataChemo', 'kataBone'];

      ids.forEach(id => { score += parseInt(document.getElementById(id)?.value || 0, 10); });

      const badge = document.getElementById('kataBadge');

      resScore.textContent = score;

        badge.textContent = `低リスク (0〜3点)`;

        surv = "1年生存率 > 80% (積極的手術や根治的放射線等の適応考慮)";

        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#e19c24]/20 text-[#e19c24]";

        riskCat = "高リスク (7〜10点)";
        surv = "1年生存率 ≤ 10% (低侵襲治療・緩和ケアを優先)";
      }
      desc.textContent = surv;

      currentCopyText = `【新片桐スコア (骨転移生命予後予測)】\n` +

                  <option value="0">≥ 12.0% (0点)</option>
                  <option value="1">9.0 〜 11.9% (1点)</option>
                  <option value="2.5">0 〜 8.9% (2.5点)</option>
                </select>
              </div>

              <!-- PaP Result -->
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-3 mt-4">
                <div>
                  <span class="text-xs font-bold text-slate-700">PaP スコア合計:</span>
                  <div class="flex items-baseline gap-1 my-0.5">
                    <span id="resPapScore" class="text-3xl font-extrabold text-[#5e81b5]">0</span>
                    <span class="text-xs text-slate-500">点</span>
                  </div>
                </div>
                <div class="text-right">
                  <span id="papBadge" class="px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]">Group A (0〜5.5点)</span>
                  <div id="papDesc" class="text-xs text-slate-600 mt-1 font-medium">30日生存率 &gt; 70%</div>
                </div>
              </div>
            </div>
          </div>
        `
      });
    }

    let activePapSubTab = 'ppi';
    function switchPapSubTab(tab) {
      activePapSubTab = tab;
      const tabI = document.getElementById('papSubTabPpi');
      const tabP = document.getElementById('papSubTabPap');
      const contI = document.getElementById('papPpiContent');
      const contP = document.getElementById('papPapContent');

      if (tab === 'ppi') {
        tabI.className = "flex-1 py-1.5 rounded-lg bg-white text-[#5e81b5] shadow-2xs";
        tabP.className = "flex-1 py-1.5 rounded-lg text-slate-600 hover:text-slate-900";
        contI.classList.remove('hidden');
        contP.classList.add('hidden');
      } else {
        tabP.className = "flex-1 py-1.5 rounded-lg bg-white text-[#5e81b5] shadow-2xs";
        tabI.className = "flex-1 py-1.5 rounded-lg text-slate-600 hover:text-slate-900";
        contP.classList.remove('hidden');
        contI.classList.add('hidden');
      }
      calcPapPpi();
    }

    function setSamplePapPpi() {
      if (activePapSubTab === 'ppi') {
        document.getElementById('ppiPps').value = '2.5';
        document.getElementById('ppiOral').value = '2.5';
        document.getElementById('ppiEdema').value = '1';
        document.getElementById('ppiDyspnea').value = '0';
        document.getElementById('ppiDelirium').value = '0';
      } else {
        document.getElementById('papPred').value = '6';
        document.getElementById('papKps').value = '2.5';
        document.getElementById('papAnorexia').value = '1.5';
      }
      calcPapPpi();
    }

    function calcPapPpi() {
      // PPI
      const pps = parseFloat(document.getElementById('ppiPps')?.value || 0);
      const oral = parseFloat(document.getElementById('ppiOral')?.value || 0);
      const edema = parseFloat(document.getElementById('ppiEdema')?.value || 0);
      const dys = parseFloat(document.getElementById('ppiDyspnea')?.value || 0);
      const del = parseFloat(document.getElementById('ppiDelirium')?.value || 0);

      const ppiScore = pps + oral + edema + dys + del;
      const resI = document.getElementById('resPpiScore');
      const badgeI = document.getElementById('ppiBadge');
      const descI = document.getElementById('ppiDesc');
      if (resI) {
        resI.textContent = ppiScore;
        if (ppiScore > 6) {
          badgeI.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#ec6235]/20 text-[#ec6235]";
          badgeI.textContent = "予後 3週未満 (>6点)";
          descI.textContent = "生命予後目安: 3週未満 (日〜週単位のケア体制確立)";
        } else if (ppiScore > 4) {
          badgeI.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#e19c24]/20 text-[#e19c24]";
          badgeI.textContent = "予後 6週未満 (>4点)";
          descI.textContent = "生命予後目安: 6週未満";
        } else {
          badgeI.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]";
          badgeI.textContent = "予後 6週以上 (≤4点)";
          descI.textContent = "生命予後目安: 6週以上";
        }
      }

      // PaP
      const ids = ['papPred', 'papKps', 'papAnorexia', 'papDyspnea', 'papWbc', 'papLym'];
      let papScore = 0;
      ids.forEach(id => { papScore += parseFloat(document.getElementById(id)?.value || 0); });
      const resP = document.getElementById('resPapScore');
      const badgeP = document.getElementById('papBadge');
      const descP = document.getElementById('papDesc');
      if (resP) {
        resP.textContent = papScore;
        if (papScore <= 5.5) {
          badgeP.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#8fb131]/20 text-[#8fb131]";
          badgeP.textContent = "Group A (0〜5.5点)";
          descP.textContent = "30日生存率 > 70%";
        } else if (papScore <= 11.0) {
          badgeP.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#e19c24]/20 text-[#e19c24]";
          badgeP.textContent = "Group B (5.6〜11.0点)";
          descP.textContent = "30日生存率 30〜70%";
        } else {
          badgeP.className = "px-3 py-1 rounded-full text-xs font-bold bg-[#ec6235]/20 text-[#ec6235]";
          badgeP.textContent = "Group C (11.1〜17.5点)";
          descP.textContent = "30日生存率 < 30%";
        }
      }

      if (activePapSubTab === 'ppi') {
        currentCopyText = `【緩和ケア PPI (Palliative Prognostic Index)】\n` +
          `・PPIスコア: ${ppiScore} 点 [${ppiScore > 6 ? '予後3週未満 (>6点)' : ppiScore > 4 ? '予後6週未満 (>4点)' : '予後6週以上 (≤4点)'}]`;
      } else {
        currentCopyText = `【緩和ケア PaP スコア】\n` +
          `・PaPスコア: ${papScore} 点 [${papScore <= 5.5 ? 'Group A (30日生存率>70%)' : papScore <= 11 ? 'Group B (30日生存率30-70%)' : 'Group C (30日生存率<30%)'}]`;
      }
    }

    function copyPapPpiResult() { copyToClipboard(currentCopyText); }

    // -------------------------------------------------------------------------
    // 18. ECOG-PS & Karnofsky Performance Status (KPS)
    // -------------------------------------------------------------------------
    function renderEcogKps() {
      return toolShell({
        title: 'ECOG-PS & Karnofsky (KPS) 全身状態評価',
        subtitle: 'パフォーマンスステータス対比一覧およびワンクリックカルテ転記',
        badgeText: '全身状態・ADL',
        sampleFn: 'setSampleEcogKps',
        copyFn: 'copyEcogKpsResult',
        formulaBoxHtml: `
          <div><strong>対比関係:</strong> PS 0 (KPS 90-100%) / PS 1 (KPS 70-80%) / PS 2 (KPS 50-60%) / PS 3 (KPS 30-40%) / PS 4 (KPS 10-20%)</div>
          <div><strong>定義:</strong> 腫瘍内科・緩和ケア・臨床試験における日常生活遂行能力 (ADL) の標準評価指標</div>
        `,
        contentHtml: `
          <div class="space-y-3 text-xs">
            <p class="text-slate-600 text-[11px]">該当するステータスを選択してください。カルテ転記用テキストが自動生成されます。</p>

            <div class="space-y-2">
              <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition has-[:checked]:bg-[#5e81b5]/15 has-[:checked]:border-[#5e81b5]">
                <input type="radio" name="psSelect" value="0" class="mt-1" checked onchange="calcEcogKps()">
                <div class="flex-1">
                  <div class="flex items-center justify-between font-bold text-slate-900">
                    <span>ECOG PS 0 (正常・無症状)</span>
                    <span class="text-[#5e81b5]">KPS 100〜90%</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5">発症前と変わらずに日常生活・社会活動を行うことができる。</p>
                </div>
              </label>

              <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition has-[:checked]:bg-[#5e81b5]/15 has-[:checked]:border-[#5e81b5]">
                <input type="radio" name="psSelect" value="1" class="mt-1" onchange="calcEcogKps()">
                <div class="flex-1">
                  <div class="flex items-center justify-between font-bold text-slate-900">
                    <span>ECOG PS 1 (軽度の症状・軽労働可)</span>
                    <span class="text-[#5e81b5]">KPS 80〜70%</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5">肉体的に激しい活動は制限されるが、歩行や軽作業・座業(事務など)は行える。</p>
                </div>
              </label>

              <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition has-[:checked]:bg-[#5e81b5]/15 has-[:checked]:border-[#5e81b5]">
                <input type="radio" name="psSelect" value="2" class="mt-1" onchange="calcEcogKps()">
                <div class="flex-1">
                  <div class="flex items-center justify-between font-bold text-slate-900">
                    <span>ECOG PS 2 (歩行可能・身の回り自立)</span>
                    <span class="text-[#5e81b5]">KPS 60〜50%</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5">歩行や身の回りのことは自立しているが作業はできない。日中の半分以上は起居している。</p>
                </div>
              </label>

              <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition has-[:checked]:bg-[#5e81b5]/15 has-[:checked]:border-[#5e81b5]">
                <input type="radio" name="psSelect" value="3" class="mt-1" onchange="calcEcogKps()">
                <div class="flex-1">
                  <div class="flex items-center justify-between font-bold text-slate-900">
                    <span>ECOG PS 3 (介助必要・日中半分以上ベッド上)</span>
                    <span class="text-[#5e81b5]">KPS 40〜30%</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5">限られた身の回りのことしかできず、日中の50%以上をベッドや車椅子で過ごす。</p>
                </div>
              </label>

              <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition has-[:checked]:bg-[#5e81b5]/15 has-[:checked]:border-[#5e81b5]">
                <input type="radio" name="psSelect" value="4" class="mt-1" onchange="calcEcogKps()">
                <div class="flex-1">
                  <div class="flex items-center justify-between font-bold text-slate-900">
                    <span>ECOG PS 4 (完全寝たきり)</span>
                    <span class="text-[#5e81b5]">KPS 20〜10%</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5">全く動けず、身の回りのこともできない。終日ベッドまたは車椅子で過ごす。</p>
                </div>
              </label>
            </div>

            <!-- Preview Card -->
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
              <span class="font-bold text-slate-700 block mb-1">カルテ転記プレビュー:</span>
              <pre id="psPreviewText" class="p-2.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-mono text-[11px] whitespace-pre-wrap"></pre>
            </div>
          </div>
        `
      });
    }

    function setSampleEcogKps() {
      const radio = document.querySelector('input[name="psSelect"][value="1"]');
      if (radio) radio.checked = true;
      calcEcogKps();
    }

    function calcEcogKps() {
      const val = document.querySelector('input[name="psSelect"]:checked')?.value || "0";
      const preview = document.getElementById('psPreviewText');

      const data = {
        "0": { ecog: "0", kps: "90〜100%", desc: "発症前と変わらずに日常生活・社会活動を行うことができる" },
        "1": { ecog: "1", kps: "70〜80%", desc: "肉体的に激しい活動は制限されるが、歩行や軽作業・座業は可能" },
        "2": { ecog: "2", kps: "50〜60%", desc: "歩行や身の回りのことは自立しているが作業は不能。日中50%以上起居" },
        "3": { ecog: "3", kps: "30〜40%", desc: "限られた身の回りしかできず、日中50%以上をベッドや車椅子で過ごす" },
        "4": { ecog: "4", kps: "10〜20%", desc: "全く動けず完全寝たきり。終日ベッドまたは車椅子で過ごす" }
      }[val];

      currentCopyText = `【全身状態 Performance Status】\n` +
        `・ECOG-PS: ${data.ecog} (KPS目安: ${data.kps})\n` +
        `・状態: ${data.desc}`;

      if (preview) preview.textContent = currentCopyText;
    }

    function copyEcogKpsResult() { copyToClipboard(currentCopyText); }

  </script>
</body>
</html>
